# Runs the same checks as `make check`: lint, typecheck and the build in one
# job, the Playwright smoke tests against the built site in another, so a
# style offense and a broken page show up as two separate red marks. They run
# on the runner instead of in the containers because setup-node-with-pnpm has
# a cached store ready in seconds, while the image would have to be rebuilt
# on every run.
#
# `@main` on purpose: this repository follows the head of github-toolkit
# instead of pinning a release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: yamat47/github-toolkit/actions/checkout@main
      - uses: yamat47/github-toolkit/actions/setup-node-with-pnpm@main
        with:
          node-version-file: .node-version
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - uses: yamat47/github-toolkit/actions/upload-artifact@main
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  e2e:
    name: Smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: yamat47/github-toolkit/actions/checkout@main
      - uses: yamat47/github-toolkit/actions/setup-node-with-pnpm@main
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: yamat47/github-toolkit/actions/setup-playwright-chromium@main
        with:
          working-directory: e2e
      - run: pnpm test
      - uses: yamat47/github-toolkit/actions/upload-artifact@main
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
